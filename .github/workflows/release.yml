name: Publish to npm

# Publishes when a GitHub Release is published.
# Requires an NPM_TOKEN repository secret (npm access token with publish rights).
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Publish to npm (skip if this version is already published)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "unofficial-gmi-cloud-cli@$VERSION" version >/dev/null 2>&1; then
            echo "unofficial-gmi-cloud-cli@$VERSION is already on npm — skipping publish."
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
